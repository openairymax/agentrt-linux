# SPDX-License-Identifier: GPL-2.0-only
# AirymaxOS custom Yocto layer, reuses openEuler Embedded Yocto 4.0 Kirkstone baseline.
# See docs-closed/agentrt-linux/01-openeuler-tech-reference/12-build-and-flash-strategy.md §2.2

BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

LAYERSERIES_COMPAT_meta-airymax = "kirkstone mickledore"
LAYERDEPENDS_meta-airymax = "core openembedded-layer yocto"
LAYERVERSION_meta-airymax = "1.0"
