# SPDX-License-Identifier: GPL-2.0-only
#
# ks-airymax.cfg — AirymaxOS Kickstart.
# Reuses openEuler Anaconda installer; only ks.cfg is customized.
# See docs-closed/agentrt-linux/01-openeuler-tech-reference/12-build-and-flash-strategy.md §4.1
#
# Brand/package name overridden; Anaconda, partitioning, bootloader logic and
# dependency resolution are reused from openEuler 24.03 LTS unmodified.

install
cdrom

lang zh_CN.UTF-8
keyboard us
timezone Asia/Shanghai

# Network: default DHCP on the first link-attached NIC.
network --bootproto=dhcp --device=link --activate

# Root account locked on install; first login via Cockpit Web UI (§5.1).
rootpw --lock

# Bootloader: reuse Anaconda grub2 install to MBR/EFI.
bootloader --location=mbr --append="console=tty0 console=ttyS0,115200n8"

# Firewall: open Cockpit (9090/tcp) and SSH by default; UI layer per §5.
firewall --enabled --service=ssh,cockpit

# SELinux: enforcing (airy_lsm hooks layered on top, see §1.1 / IRON-7).
selinux --enforcing

# AirymaxOS packages.
# - @airy-base / @core: base environment groups
# - airy-kernel*: self-built kernel stack (§1.2)
# - airy-lsm-tools / airy-sc-toolchain: AirymaxOS userspace
# - cockpit / cockpit-airymax: Layer 0 Web UI (§5.1)
%packages
@airy-base
@core
airy-kernel
airy-kernel-devel
airy-kernel-headers
airy-kernel-modules
airy-lsm-tools
airy-sc-toolchain
cockpit
cockpit-airymax
%end

# Post-install (nochroot): enable the Cockpit Web UI socket so it starts on
# first boot. Anaconda writes this into the installed system's preset set.
%post --nochroot
systemctl enable cockpit.socket
%end

reboot
