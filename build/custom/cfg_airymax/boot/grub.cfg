#
# AirymaxOS GRUB2 boot menu.
# Brand-customised; reuses openEuler grub2 mechanism via imageTailor.
# See docs-closed/agentrt-linux/01-openeuler-tech-reference/12-build-and-flash-strategy.md §2.1
#
set default=0
set timeout=5

### BEGIN /etc/grub.d/00_header ###
load_env
if [ "${next_entry}" ] ; then
   set default="${next_entry}"
   set next_entry=
   save_env next_entry
   set boot_once=true
else
   set default="${saved_entry}"
fi
### END /etc/grub.d/00_header ###

serial --speed=115200 --unit=0 --word=8 --parity=no --stop=1
terminal_input serial console
terminal_output serial console

menuentry "AirymaxOS 1.0.1 (6.6.0-airy.1)" --class airymax --class gnu-linux --class gnu --class os {
    set root='hd0,msdos1'
    linux /boot/vmlinuz-6.6.0-airy.1 root=UUID=airymax-root ro rd.driver.pre=virtio_blk console=tty0 console=ttyS0,115200n8
    initrd /boot/initramfs-6.6.0-airy.1.img
}

menuentry "AirymaxOS 1.0.1 (6.6.0-airy.1) rescue mode" --class airymax --class gnu-linux --class gnu --class os {
    set root='hd0,msdos1'
    linux /boot/vmlinuz-6.6.0-airy.1 root=UUID=airymax-root ro single console=tty0 console=ttyS0,115200n8
    initrd /boot/initramfs-6.6.0-airy.1.img
}
